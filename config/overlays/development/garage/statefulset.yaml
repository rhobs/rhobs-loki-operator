apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      containers:
      - command:
        - /garage
        - server
        - --single-node
        - --default-bucket
        env:
        - name: GARAGE_CONFIG_FILE
          value: /etc/garage/garage.toml
        - name: GARAGE_DEFAULT_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: access_key_id
              name: test
        - name: GARAGE_DEFAULT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: access_key_secret
              name: test
        - name: GARAGE_DEFAULT_BUCKET
          valueFrom:
            secretKeyRef:
              key: bucketnames
              name: test
        image: docker.io/dxflrs/garage:v2.5.0
        name: garage
        ports:
        - containerPort: 3900
          name: s3
        readinessProbe:
          httpGet:
            path: /health
            port: 3903
        volumeMounts:
        - mountPath: /var/lib/garage
          name: data
        - mountPath: /etc/garage
          name: config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: garage-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
